name: Set Up Node.js Project
description: >-
  Set up Node.js and the project's package manager, then install dependencies from the lockfile.
  A pnpm-lock.yaml selects pnpm; any other project uses npm.
  Later steps can run scripts through the PACKAGE_MANAGER environment variable.
inputs:
  working_directory:
    description: Directory containing the project's package.json and lockfile.
    default: '.'
  node_version_file:
    description: Repository-relative Node.js version file.
    default: '.nvmrc'
  npm_version:
    description: >-
      Optional exact stable npm version override for npm projects.
      Defaults to the exact packageManager version in package.json.
    default: ''
  registry_url:
    description: Registry that actions/setup-node configures for authentication, such as https://registry.npmjs.org.
    default: ''
  cache:
    description: Whether to cache the package manager store.
    default: 'true'
outputs:
  package_manager:
    description: The selected package manager, npm or pnpm.
    value: ${{ steps.detect.outputs.package_manager }}
runs:
  using: composite
  steps:
    - name: Detect the package manager
      id: detect
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        if [ -f pnpm-lock.yaml ]; then PACKAGE_MANAGER=pnpm; else PACKAGE_MANAGER=npm; fi
        echo "package_manager=$PACKAGE_MANAGER" >> "$GITHUB_OUTPUT"
        echo "PACKAGE_MANAGER=$PACKAGE_MANAGER" >> "$GITHUB_ENV"
    # actions/setup-node provides Node.js, npm, and the registry configuration for both package managers.
    - uses: actions/setup-node@v7
      with:
        node-version-file: ${{ inputs.node_version_file }}
        cache: ${{ steps.detect.outputs.package_manager == 'npm' && inputs.cache == 'true' && 'npm' || '' }}
        cache-dependency-path: ${{ inputs.working_directory }}/**/package-lock.json
        package-manager-cache: false
        registry-url: ${{ inputs.registry_url }}
    - name: Use the repository npm version
      if: ${{ steps.detect.outputs.package_manager == 'npm' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        NPM_VERSION_OVERRIDE: ${{ inputs.npm_version }}
      run: |
        set -euo pipefail
        NPM_VERSION="$NPM_VERSION_OVERRIDE"
        if [ -z "$NPM_VERSION" ]; then
          NPM_VERSION="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { packageManager } = JSON.parse(readFileSync("package.json", "utf8"));
            const match = /^npm@((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$/.exec(packageManager ?? "");
            if (!match) throw new Error("package.json must declare an exact npm packageManager version.");
            console.log(match[1]);
          ')"
        fi

        if [[ ! "$NPM_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
          echo "The npm version must be an exact stable semantic version without leading zeroes."
          exit 1
        fi

        # npm verifies the registry tarball integrity; the caller pins the exact version.
        npm install --global --ignore-scripts "npm@$NPM_VERSION"
        INSTALLED_NPM_VERSION="$(npm --version)"
        if [ "$INSTALLED_NPM_VERSION" != "$NPM_VERSION" ]; then
          echo "Expected npm $NPM_VERSION, but installed $INSTALLED_NPM_VERSION."
          exit 1
        fi
    - name: Install npm dependencies
      if: ${{ steps.detect.outputs.package_manager == 'npm' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: npm ci
    # pnpm/setup reads the pnpm version from packageManager and runs pnpm install --frozen-lockfile.
    - uses: pnpm/setup@v3
      if: ${{ steps.detect.outputs.package_manager == 'pnpm' }}
      with:
        working-directory: ${{ inputs.working_directory }}
        # actions/setup-node already installed Node.js from node_version_file; do not install a second runtime.
        node-version-file: false
        cache: ${{ inputs.cache }}
        require-lockfile: true
