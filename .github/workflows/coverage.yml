name: Merge and Upload Coverage

on:
  workflow_call:
    inputs:
      runs_on_labels:
        description: |
          JSON-based collection of labels indicating which type of GitHub runner should be chosen.
          Merging xcresult bundles needs macOS.
        required: false
        type: string
        default: '["macos-26"]'
      xcodeversion:
        description: |
          The Xcode version used to merge the coverage reports.
        required: false
        type: string
        default: 'latest-stable'
      coveragereports:
        description: |
          A string containing all names of the .xcresult files that are downloaded from the artifacts of previous jobs.
          Multiple values are separated by a space character.
        required: false
        type: string
      coveragereports_lcov:
        description: |
          A string containing all names of the .lcov files that are downloaded from the artifacts of previous jobs.
          Multiple values are separated by a space character.
          For proper coverage merging with .xcresult files, lcov files must contain only function coverage data.
        required: false
        type: string
    secrets:
      token:
        description: |
          The Codecov token used for private repositories.
        required: false

permissions:
  actions: read
  contents: read

jobs:
  create-and-upload-coverage-report:
    name: Merge and Upload Coverage
    runs-on: ${{ fromJson(inputs.runs_on_labels) }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcodeversion }}
      - name: Check environment
        run: |
            xcodebuild -version
            swift --version
      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/coverage-artifacts
      - name: Install lcov
        if: ${{ inputs.coveragereports_lcov != '' }}
        run: |
          if ! command -v lcov &> /dev/null; then
            echo "Installing lcov..."
            brew install lcov
          fi
      - name: Merge lcov coverage reports
        if: ${{ inputs.coveragereports_lcov != '' && inputs.coveragereports == '' }}
        env:
          ARTIFACTS_DIRECTORY: ${{ runner.temp }}/coverage-artifacts
          COVERAGE_REPORTS_LCOV: ${{ inputs.coveragereports_lcov }}
        run: |
          shopt -s nullglob
          cd "$ARTIFACTS_DIRECTORY"

          # Intentional word splitting + glob expansion of the space-separated patterns (globbing is the point here).
          # shellcheck disable=SC2206
          FILES=( $COVERAGE_REPORTS_LCOV )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No lcov reports matched pattern: $COVERAGE_REPORTS_LCOV"
            exit 1
          fi

          args=()
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              report="$file"
            elif [ -f "$file/$(basename "$file")" ]; then
              report="$file/$(basename "$file")"
            else
              echo "::error::$file does not contain an lcov report"
              exit 1
            fi
            args+=(-a "$report")
          done
          lcov --no-function-coverage "${args[@]}" -o "$GITHUB_WORKSPACE/info.lcov"
      - name: Merge xcresult coverage reports
        if: ${{ inputs.coveragereports != '' }}
        env:
          ARTIFACTS_DIRECTORY: ${{ runner.temp }}/coverage-artifacts
          COVERAGE_REPORTS: ${{ inputs.coveragereports }}
        run: |
          shopt -s nullglob

          # download-artifact extracts a lone artifact directly into the destination instead of creating a named wrapper.
          if [ -f "$ARTIFACTS_DIRECTORY/Info.plist" ] && [ -d "$ARTIFACTS_DIRECTORY/Data" ]; then
            read -r -a REQUESTED <<< "$COVERAGE_REPORTS"
            if [ "${#REQUESTED[@]}" -ne 1 ]; then
              echo "::error::Expected one coverage report for the flattened artifact layout, received: $COVERAGE_REPORTS"
              exit 1
            fi

            cp -R "$ARTIFACTS_DIRECTORY" "$GITHUB_WORKSPACE/CodeCoverage.xcresult"
            exit 0
          fi

          cd "$ARTIFACTS_DIRECTORY"

          # Intentional word splitting + glob expansion of the space-separated patterns (globbing is the point here).
          # shellcheck disable=SC2206
          FILES=( $COVERAGE_REPORTS )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No coverage reports matched pattern: $COVERAGE_REPORTS"
            exit 1
          fi

          for file in "${FILES[@]}"; do
            if [ ! -f "$file/Info.plist" ] || [ ! -d "$file/Data" ]; then
              echo "::error::$file is not an xcresult bundle"
              exit 1
            fi
          done

          if [ "${#FILES[@]}" -gt 1 ]; then
            xcrun xcresulttool merge "${FILES[@]}" --output-path "$GITHUB_WORKSPACE/CodeCoverage.xcresult"
          else
            mv "${FILES[0]}" "$GITHUB_WORKSPACE/CodeCoverage.xcresult"
          fi
      - uses: schmiedmayerlab/xccov2lcov@v1
        if: ${{ inputs.coveragereports != '' }}
        with:
          xcresult: CodeCoverage.xcresult
      - name: Merge xcresult and lcov
        if: ${{ inputs.coveragereports_lcov != '' && inputs.coveragereports != '' }}
        env:
          ARTIFACTS_DIRECTORY: ${{ runner.temp }}/coverage-artifacts
          COVERAGE_REPORTS_LCOV: ${{ inputs.coveragereports_lcov }}
        run: |
          shopt -s nullglob
          cd "$ARTIFACTS_DIRECTORY"

          # Intentional word splitting + glob expansion of the space-separated patterns (globbing is the point here).
          # shellcheck disable=SC2206
          FILES=( $COVERAGE_REPORTS_LCOV )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No lcov reports matched pattern: $COVERAGE_REPORTS_LCOV"
            exit 1
          fi

          args=()
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              report="$file"
            elif [ -f "$file/$(basename "$file")" ]; then
              report="$file/$(basename "$file")"
            else
              echo "::error::$file does not contain an lcov report"
              exit 1
            fi
            args+=(-a "$report")
          done
          lcov --no-function-coverage \
            -a "$GITHUB_WORKSPACE/info.lcov" \
            "${args[@]}" \
            -o "$GITHUB_WORKSPACE/coverage_combined.lcov"
          mv "$GITHUB_WORKSPACE/coverage_combined.lcov" "$GITHUB_WORKSPACE/info.lcov"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          files: info.lcov
          token: ${{ secrets.token }}
