name: Markdown Links

on:
  workflow_call:
    inputs:
      runs_on_labels:
        description: |
          JSON-based collection of labels indicating which type of GitHub runner should be chosen.
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read
  pull-requests: read

jobs:
  markdown_link_check:
    name: Markdown Links
    runs-on: ${{ fromJson(inputs.runs_on_labels) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check and Create Linkspector Configuration
        run: |
          CONFIG_FILE=".linkspector.yml"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Configuration file not found. Creating a new one."
            cat > "$CONFIG_FILE" <<'EOF'
          dirs:
            - .
          useGitIgnore: true
          ignorePatterns:
            - pattern: '^doc:.*$'
            - pattern: '^http://localhost.*$'
          replacementPatterns:
            - pattern: '(.*)#gh-dark-mode-only'
              replacement: '$1'
            - pattern: '(.*)#gh-light-mode-only'
              replacement: '$1'
          EOF
          else
            echo "Configuration file exists. Skipping creation."
          fi
          echo "Contents of $CONFIG_FILE:"
          cat "$CONFIG_FILE"
      - name: Ignore Self-References in Private Repositories
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          private=$(gh api "repos/$REPO" --jq '.private' 2>/dev/null || echo false)
          if [ "$private" != "true" ]; then
            echo "Public repository; every self-reference is reachable."
            exit 0
          fi
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import os, pathlib, re, yaml
          path = pathlib.Path(".linkspector.yml")
          config = yaml.safe_load(path.read_text()) or {}
          pattern = rf"^https://github\.com/{re.escape(os.environ['REPO'])}(/.*)?$"
          patterns = config.setdefault("ignorePatterns", [])
          if not any(entry.get("pattern") == pattern for entry in patterns):
              patterns.append({"pattern": pattern})
              path.write_text(yaml.safe_dump(config, sort_keys=False))
          print(f"Private repository; ignoring {pattern}")
          PY
      - name: Linkspector
        uses: umbrelladocs/action-linkspector@v1
        with:
          filter_mode: nofilter
          reporter: github-pr-annotations
          fail_level: error
