name: Build and Deploy npm Project Pages

on:
  workflow_call:
    inputs:
      nodeVersionFile:
        description: Repository-relative Node.js version file.
        required: false
        type: string
        default: ".nvmrc"
      artifactPath:
        description: Directory produced by the pages:build script.
        required: false
        type: string
        default: "deploy"
    outputs:
      pageUrl:
        description: URL of the deployed GitHub Pages site.
        value: ${{ jobs.deploy.outputs.pageUrl }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js and install dependencies
        uses: $/actions/setup-node-project
        with:
          node_version_file: ${{ inputs.nodeVersionFile }}
      - name: Build Pages artifact
        run: '"$PACKAGE_MANAGER" run pages:build'
      - name: Verify Pages artifact
        env:
          ARTIFACT_PATH: ${{ inputs.artifactPath }}
        run: |
          set -euo pipefail
          if [ ! -d "$ARTIFACT_PATH" ] || [ ! -f "$ARTIFACT_PATH/index.html" ]; then
            echo "The pages:build script must create $ARTIFACT_PATH/index.html."
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.artifactPath }}

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      pageUrl: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
