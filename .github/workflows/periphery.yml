name: Run Periphery

on:
  workflow_call:
    inputs:
      path:
        description: |
          The path where the project is located. Defaults to $GITHUB_WORKSPACE.
        required: false
        type: string
        default: '.'
      runsonlabels:
        description: |
          JSON-based collection of labels indicating which type of GitHub runner should be chosen.
        required: false
        type: string
        default: '["macos-26"]'
      xcode-version:
        description: |
          The Xcode version used for the build.
        required: false
        type: string
        default: 'latest-stable'
      strict:
        description: |
          Whether Periphery should run in --strict mode.
        required: false
        type: boolean
        default: true
      extra-build-args:
        description: |
          Additional arguments to pass to the underlying build tool (xcodebuild or `swift build`).
          Note that this input will likely be removed in the future.
        required: false
        type: string

permissions:
  contents: read

jobs:
  periphery:
    name: Run Periphery
    runs-on: ${{ fromJson(inputs.runsonlabels) }}
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}
      - name: Check environment
        run: |
            xcodebuild -version
            swift --version
            echo "github-hosted: ${{ runner.environment == 'github-hosted' }}"
      - name: Install periphery
        if: ${{ runner.environment == 'github-hosted' }}
        run: brew install periphery
      - name: Clear DerivedData
        run: |
          # Xcode keeps its DerivedData in per-project directories named '<ProjectName>-<hash>',
          # where the hash is derived from the project's absolute path. Since the name alone is
          # ambiguous (multiple projects can share it), we additionally consult the 'info.plist'
          # Xcode writes into each of these directories, which records the absolute path of the
          # project/workspace it belongs to, and skip the ones belonging to some other project.
          set -euo pipefail
          shopt -s nullglob
          derived_data=~/Library/Developer/Xcode/DerivedData
          project_dir=$(pwd -P)
          # Xcode names the directory after the workspace/project; for Swift packages it uses the
          # name of the directory containing the Package.swift.
          name=""
          for candidate in *.xcworkspace *.xcodeproj; do
            name=$(basename "$candidate")
            name=${name%.*}
            break
          done
          [ -n "$name" ] || name=$(basename "$project_dir")
          echo "Clearing DerivedData for '$name' ($project_dir)"
          for dir in "$derived_data/$name"-*/; do
            plist="${dir}info.plist"
            if [ -f "$plist" ]; then
              # For Xcode projects this is the path of the '.xcodeproj'/'.xcworkspace' bundle,
              # for Swift packages the path of the directory containing the Package.swift.
              workspace=$(plutil -extract WorkspacePath raw -o - "$plist" 2>/dev/null || true)
              workspace_dir=$(cd "${workspace:-/}" 2>/dev/null && pwd -P || echo "$workspace")
              case "$workspace_dir" in
                "$project_dir"|"$project_dir"/*) ;;
                *) echo "Skipping $dir (belongs to '$workspace')"; continue ;;
              esac
            fi
            echo "Removing $dir"
            rm -rf "$dir"
          done
      - name: Run periphery
        run: |
          periphery scan \
            --relative-results \
            --format github-actions \
            --clean-build \
            ${{ inputs.strict && '--strict' || '' }} \
            -- \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ${{ inputs.extra-build-args }}
      - name: Clean up Periphery
        if: always()
        run: rm -rf ~/Library/Caches/com.github.peripheryapp
