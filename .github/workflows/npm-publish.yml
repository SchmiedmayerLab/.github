name: Publish npm Package

on:
  workflow_call:
    inputs:
      nodeVersion:
        description: |
          Node.js version spec to use in SemVer notation.
        required: false
        type: string
        default: '24'
      npmVersion:
        description: |
          Optional exact npm version to install before dependency resolution and publishing.
          Uses the npm version bundled with Node.js when omitted.
        required: false
        type: string
        default: ''
      cacheDependencyPath:
        description: |
          Node cache dependency path. Required only if package-lock.json is not in the root.
        required: false
        type: string
        default: ''
      workingDirectory:
        description: |
          Set the working directory if your package is not in the root.
        required: false
        type: string
        default: '.'
      packageVersion:
        description: |
          Released package version.
        required: true
        type: string
      packageTag:
        description: |
          Released package tag.
        required: false
        type: string
        default: "latest"
      workspaces:
        description: |
          Set to true to enable npm workspaces publishing.
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        description: |
          Used to perform authenticated operations against the npm registry.
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish-package:
    name: Publish npm Package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.workingDirectory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          cache-dependency-path: ${{ inputs.cacheDependencyPath }}
          node-version: ${{ inputs.nodeVersion }}
          registry-url: 'https://registry.npmjs.org'
      - name: Set up npm
        if: ${{ inputs.npmVersion != '' }}
        env:
          NPM_VERSION: ${{ inputs.npmVersion }}
        run: |
          if [[ ! "$NPM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "npmVersion must be an exact semantic version."
            exit 1
          fi

          npm install --global --ignore-scripts "npm@$NPM_VERSION"
      - name: Install dependencies
        run: npm ci
      - name: Set version
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: 'false'
          PACKAGE_VERSION: ${{ inputs.packageVersion }}
          WORKSPACES: ${{ inputs.workspaces }}
        run: |
          if [ "$WORKSPACES" = "true" ]; then
            npm version --no-git-tag-version --workspaces "$PACKAGE_VERSION"
          else
            npm version --no-git-tag-version "$PACKAGE_VERSION"
          fi
      - name: Build
        run: npm run build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_TAG: ${{ inputs.packageTag }}
          WORKSPACES: ${{ inputs.workspaces }}
        run: |
          if [ "$WORKSPACES" = "true" ]; then
            npm publish --workspaces --provenance --access public --tag "$PACKAGE_TAG"
          else
            npm publish --provenance --access public --tag "$PACKAGE_TAG"
          fi
