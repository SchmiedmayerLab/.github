name: Run SwiftLint

on:
  workflow_call:
    inputs:
      version:
        description: |
          SwiftLint version.
        type: string
        default: latest
        required: false
      runs_on_labels:
        description: |
          JSON-based collection of labels indicating which type of GitHub runner should be chosen.
        required: false
        type: string
        # Match the Ubuntu release used to build SwiftLint; newer images may lack its shared libraries.
        default: '["ubuntu-24.04"]'
      path:
        description: |
          The path where the project is located. Defaults to $GITHUB_WORKSPACE.
        required: false
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  swiftlint:
    name: Run SwiftLint
    runs-on: ${{ fromJson(inputs.runs_on_labels) }}
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run SwiftLint
        uses: schmiedmayerlab/action-swiftlint@v4
        with:
          args: --strict
          version: ${{ inputs.version }}
