name: Run Swift Tests

on:
  workflow_call:
    inputs:
      path:
        description: |
          The path where the project is located. Defaults to $GITHUB_WORKSPACE.
        required: false
        type: string
        default: '.'
      runs_on_labels:
        description: |
          JSON-based collection of labels indicating which type of GitHub runner should be chosen.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      swift_version:
        description: |
          Specify the Swift language version.
        required: false
        type: string
        default: ''
      environment:
        description: |
          GitHub deployment environment to optionally adjust access to variables and secrets with additional protection rules.
          https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment
        required: false
        type: string
        default: ''
      checkout_submodules:
        description: |
          Flag indicating if submodules should be automatically checked out.
        required: false
        type: boolean
      checkout_lfs:
        description: |
          Flag indicating if Git LFS should be used when running the checkout step.
        required: false
        type: boolean
        default: false
      artifact_name:
        description: |
          The name of the artifact that should be uploaded at the end of the build.
        required: false
        type: string
      build_configuration:
        description: |
          The build configuration parameter that should be passed to SwiftPM.
          Either use `Debug` or `Release` to build in the respective modes.
          If not defined, the `Debug` configuration is used.
        required: false
        type: string
        default: Debug
      build_flags:
        description: |
          Additional build flags to pass to `swift test` (e.g. --build-system native, -Xswiftc -warnings-as-errors).
        required: false
        type: string
        default: ''
      test_flags:
        description: |
          Additional test flags to pass to `swift test` (e.g. --no-parallel, --filter, --skip).
        required: false
        type: string
        default: ''
      job_name:
        description: |
          The name of the job as it appears in the GitHub Actions UI.
        required: false
        type: string
        default: 'Swift Test'
    secrets:
      CHECKOUT_TOKEN:
        description: |
          The personal access token (PAT) to use with the checkout action.
        required: false

permissions:
  contents: read

jobs:
  swift_test:
    name: ${{ inputs.job_name }}
    runs-on: ${{ fromJson(inputs.runs_on_labels) }}
    defaults:
      run:
        working-directory: ${{ inputs.path }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          # This is GitHub's way of implementing ternary expressions (see https://docs.github.com/en/actions/learn-github-actions/expressions)
          token: ${{ secrets.CHECKOUT_TOKEN != '' && secrets.CHECKOUT_TOKEN || github.token }}
          submodules: ${{ inputs.checkout_submodules }}
          lfs: ${{ inputs.checkout_lfs }}
      - name: Set up Swift
        uses: SwiftyLab/setup-swift@v1
        with:
          swift-version: ${{ inputs.swift_version || 'latest' }}
      # `swift test` is the only compile: a separate `swift build` uses different compiler flags, so every Swift module would compile twice.
      # Release jobs therefore no longer compile without `-enable-testing`, and errors that only appear in a plain Release build go uncaught here.
      # Lukas Kollmer decided this is a worthwhile tradeoff (see #47).
      - name: Run tests
        env:
          BUILD_CONFIGURATION: ${{ inputs.build_configuration }}
          # Package fetches answer GitHub's challenge with the job token; anonymous clones are throttled per address.
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
          BUILD_FLAGS: ${{ inputs.build_flags }}
          TEST_FLAGS: ${{ inputs.test_flags }}
        run: |
          build_configuration="$(printf '%s' "$BUILD_CONFIGURATION" | awk '{print tolower($0)}')"
          build_args=()
          if [ -n "$BUILD_FLAGS" ]; then
            read -r -a build_args <<< "$BUILD_FLAGS"
          fi
          test_args=()
          if [ -n "$TEST_FLAGS" ]; then
            read -r -a test_args <<< "$TEST_FLAGS"
          fi

          swift test \
            --enable-code-coverage \
            --configuration "$build_configuration" \
            "${build_args[@]}" \
            "${test_args[@]}"
      - name: Generate coverage report
        if: ${{ (success() || failure()) && inputs.artifact_name != '' }}
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          BUILD_CONFIGURATION: ${{ inputs.build_configuration }}
        run: |
          CONFIG="$(printf '%s' "$BUILD_CONFIGURATION" | awk '{print tolower($0)}')"
          # The native build system writes .build/<triple>/<config> with one .xctest; Swift 6.4's default
          # build system writes .build/out/Products/<Config>-<platform> with one Tests.so per test target.
          COVERAGE_FILE=$(find .build -ipath "*/$CONFIG*/codecov/*.profdata" -type f | head -1)
          mapfile -t TEST_BINARIES < <(find .build -ipath "*/$CONFIG*" \( -name "*.xctest" -o -name "*Tests.so" \) -type f -not -path "*/checkouts/*")
          OBJECTS=("${TEST_BINARIES[0]}")
          for binary in "${TEST_BINARIES[@]:1}"; do
            OBJECTS+=(-object "$binary")
          done
          llvm-cov export \
            "${OBJECTS[@]}" \
            --instr-profile="$COVERAGE_FILE" \
            --format=lcov > "$ARTIFACT_NAME"
      - name: Upload artifact
        if: ${{ (success() || failure()) && inputs.artifact_name != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.path }}/${{ inputs.artifact_name }}
