name: Publish npm Release

on:
  workflow_call:
    inputs:
      packageVersion:
        description: >-
          Bare semantic version shared by all published packages.
          Defaults to the published GitHub release tag.
        required: false
        type: string
        default: ""
      bootstrapPackages:
        description: >-
          Unpublished packages authorized for one token-based publication.
          Accepts comma-separated names or *.
        required: false
        type: string
        default: ""
      nodeVersionFile:
        description: Repository-relative Node.js version file.
        required: false
        type: string
        default: ".nvmrc"
      dryRun:
        description: Plan, version, build, and verify packages without publishing.
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        description: Short-lived granular token used only for package bootstrap.
        required: false
    outputs:
      version:
        description: Validated release version.
        value: ${{ jobs.publish.outputs.version }}
      prerelease:
        description: Whether the release version is a prerelease.
        value: ${{ jobs.publish.outputs.prerelease }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.nodeVersionFile }}
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Use the repository npm version
        run: |
          set -euo pipefail
          NPM_VERSION="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { packageManager } = JSON.parse(readFileSync("package.json", "utf8"));
            const match = /^npm@((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$/.exec(packageManager ?? "");
            if (!match) throw new Error("package.json must declare an exact npm packageManager version.");
            console.log(match[1]);
          ')"
          # npm verifies the registry tarball integrity; the caller pins the exact version.
          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          INSTALLED_NPM_VERSION="$(npm --version)"
          if [ "$INSTALLED_NPM_VERSION" != "$NPM_VERSION" ]; then
            echo "Expected npm $NPM_VERSION, but installed $INSTALLED_NPM_VERSION."
            exit 1
          fi
      - name: Verify Trusted Publishing runtime support
        run: |
          node --input-type=module <<'NODE'
          const node = process.versions.node.split('.').map(Number)
          const { execFileSync } = await import('node:child_process')
          const npmVersion = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim()
          const npm = npmVersion.match(/^(\d+)\.(\d+)\.(\d+)$/)?.slice(1).map(Number)

          if (node[0] < 22 || (node[0] === 22 && node[1] < 14)) {
            throw new Error(`Node.js 22.14.0 or newer is required; found ${process.versions.node}.`)
          }
          if (!npm || npm[0] < 11 || (npm[0] === 11 && npm[1] < 5) ||
              (npm[0] === 11 && npm[1] === 5 && npm[2] < 1)) {
            throw new Error(`npm 11.5.1 or newer is required; found ${npmVersion}.`)
          }
          NODE
      - name: Validate release source
        if: ${{ !inputs.dryRun }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              echo "Manual releases must run from the default branch ($DEFAULT_BRANCH)."
              exit 1
            fi
            MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)"
            if [ "$RELEASE_SHA" != "$MAIN_SHA" ]; then
              echo "Release candidate $RELEASE_SHA is not the current $DEFAULT_BRANCH commit $MAIN_SHA."
              exit 1
            fi
          elif ! git merge-base --is-ancestor "$RELEASE_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "Release candidate $RELEASE_SHA is not part of $DEFAULT_BRANCH."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Plan and prepare release
        id: plan
        env:
          BOOTSTRAP_PACKAGES: ${{ inputs.bootstrapPackages }}
          PACKAGE_VERSION: ${{ inputs.packageVersion || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { appendFile, readFile, writeFile } from 'node:fs/promises'
          import { resolve } from 'node:path'

          const semverPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/
          const version = process.env.PACKAGE_VERSION
          const match = semverPattern.exec(version)
          if (!match) {
            throw new Error(`Release version must be bare semantic versioning without a v prefix: ${version}`)
          }

          const bootstrapPackages = new Set(
            (process.env.BOOTSTRAP_PACKAGES ?? '').split(/[\s,]+/).filter(Boolean),
          )
          if (bootstrapPackages.has('*') && bootstrapPackages.size > 1) {
            throw new Error('Use either * or explicit bootstrap package names, not both.')
          }

          const rootManifest = JSON.parse(await readFile('package.json', 'utf8'))
          const workspaceConfiguration =
            Array.isArray(rootManifest.workspaces) ? rootManifest.workspaces : rootManifest.workspaces?.packages
          const locations =
            workspaceConfiguration?.length ?
              JSON.parse(execFileSync('npm', ['query', '.workspace', '--json'], { encoding: 'utf8' }))
                .map(({ location }) => location)
            : ['.']
          const workspacePackages = await Promise.all(
            locations.map(async (location) => {
              const path = resolve(location, 'package.json')
              return { location, path, manifest: JSON.parse(await readFile(path, 'utf8')) }
            }),
          )
          const publicPackages = workspacePackages.filter(
            ({ manifest }) => !manifest.private && manifest.name,
          )
          if (publicPackages.length === 0) {
            throw new Error('No public npm packages were found.')
          }

          const packagesByName = new Map(
            publicPackages.map((workspacePackage) => [workspacePackage.manifest.name, workspacePackage]),
          )
          const permanent = new Set()
          const temporary = new Set()
          const sortedPackages = []
          const visit = (workspacePackage) => {
            const name = workspacePackage.manifest.name
            if (permanent.has(name)) return
            if (temporary.has(name)) {
              throw new Error(`Runtime workspace dependency cycle includes ${name}.`)
            }
            temporary.add(name)
            for (const dependencyName of Object.keys({
              ...workspacePackage.manifest.dependencies,
              ...workspacePackage.manifest.optionalDependencies,
            })) {
              const dependency = packagesByName.get(dependencyName)
              if (dependency) visit(dependency)
            }
            temporary.delete(name)
            permanent.add(name)
            sortedPackages.push(workspacePackage)
          }
          for (const workspacePackage of publicPackages) visit(workspacePackage)

          const packageNames = new Set(sortedPackages.map(({ manifest }) => manifest.name))
          const unknownPackages = [...bootstrapPackages].filter(
            (name) => name !== '*' && !packageNames.has(name),
          )
          if (unknownPackages.length > 0) {
            throw new Error(`Unknown bootstrap packages: ${unknownPackages.join(', ')}`)
          }

          const plan = { all: [], oidc: [], bootstrap: [], skipped: [] }
          const errors = []
          for (const { manifest } of sortedPackages) {
            const name = manifest.name
            plan.all.push(name)
            const response = await fetch(
              `https://registry.npmjs.org/${encodeURIComponent(name)}`,
              { headers: { accept: 'application/json' }, signal: AbortSignal.timeout(30_000) },
            )
            if (response.status !== 404 && !response.ok) {
              throw new Error(`Unable to read npm registry metadata for ${name}: HTTP ${response.status}`)
            }
            const metadata = response.status === 404 ? null : await response.json()
            const selectedForBootstrap =
              bootstrapPackages.has('*') || bootstrapPackages.has(name)

            if (metadata?.versions?.[version]) plan.skipped.push(name)
            else if (!metadata && selectedForBootstrap) plan.bootstrap.push(name)
            else if (!metadata) errors.push(`${name} is unpublished and requires bootstrap authorization.`)
            else if (selectedForBootstrap) errors.push(`${name} already exists and must use OIDC.`)
            else plan.oidc.push(name)
          }
          if (errors.length > 0) {
            throw new Error(`Release plan is invalid:\n- ${errors.join('\n- ')}`)
          }

          const internalVersions = new Map(plan.all.map((name) => [name, version]))
          const dependencyFields = [
            'dependencies',
            'devDependencies',
            'optionalDependencies',
            'peerDependencies',
          ]
          for (const workspacePackage of publicPackages) {
            workspacePackage.manifest.version = version
            for (const field of dependencyFields) {
              for (const dependencyName of Object.keys(workspacePackage.manifest[field] ?? {})) {
                const internalVersion = internalVersions.get(dependencyName)
                if (internalVersion) workspacePackage.manifest[field][dependencyName] = internalVersion
              }
            }
            await writeFile(
              workspacePackage.path,
              `${JSON.stringify(workspacePackage.manifest, null, 2)}\n`,
            )
          }

          const prerelease = match[4] !== undefined
          const outputs = {
            ...plan,
            version,
            prerelease,
            'npm-tag': prerelease ? 'next' : 'latest',
            workspaces: workspaceConfiguration?.length ? 'true' : 'false',
          }
          await appendFile(
            process.env.GITHUB_OUTPUT,
            `${Object.entries(outputs)
              .map(([name, value]) => `${name}=${typeof value === 'string' ? value : JSON.stringify(value)}`)
              .join('\n')}\n`,
          )

          console.log(`Release ${version}:`)
          console.log(`- OIDC: ${plan.oidc.join(', ') || 'none'}`)
          console.log(`- Token bootstrap: ${plan.bootstrap.join(', ') || 'none'}`)
          console.log(`- Already published: ${plan.skipped.join(', ') || 'none'}`)
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Run repository release preparation
        run: npm run release:prepare --if-present
      - name: Build packages
        run: npm run build --if-present
      - name: Verify release package contents
        run: |
          npm run pack:check --if-present
          npm run pack:lint --if-present
      - name: Publish existing packages with Trusted Publishing
        if: ${{ !inputs.dryRun && steps.plan.outputs.oidc != '[]' }}
        env:
          NPM_TAG: ${{ steps.plan.outputs.npm-tag }}
          PACKAGES: ${{ steps.plan.outputs.oidc }}
          WORKSPACES: ${{ steps.plan.outputs.workspaces }}
        run: |
          set -euo pipefail
          PACKAGE_LINES="$(node --input-type=module -e 'for (const name of JSON.parse(process.env.PACKAGES)) console.log(name)')"
          mapfile -t PACKAGE_NAMES <<< "$PACKAGE_LINES"
          for PACKAGE_NAME in "${PACKAGE_NAMES[@]}"; do
            if [ "$WORKSPACES" = "true" ]; then
              npm publish --workspace "$PACKAGE_NAME" --provenance --access public --tag "$NPM_TAG"
            else
              npm publish --provenance --access public --tag "$NPM_TAG"
            fi
          done
      - name: Bootstrap unpublished packages with npm token
        if: ${{ !inputs.dryRun && steps.plan.outputs.bootstrap != '[]' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.plan.outputs.npm-tag }}
          PACKAGES: ${{ steps.plan.outputs.bootstrap }}
          WORKSPACES: ${{ steps.plan.outputs.workspaces }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is required to bootstrap unpublished packages."
            exit 1
          fi
          PACKAGE_LINES="$(node --input-type=module -e 'for (const name of JSON.parse(process.env.PACKAGES)) console.log(name)')"
          mapfile -t PACKAGE_NAMES <<< "$PACKAGE_LINES"
          for PACKAGE_NAME in "${PACKAGE_NAMES[@]}"; do
            if [ "$WORKSPACES" = "true" ]; then
              npm publish --workspace "$PACKAGE_NAME" --provenance --access public --tag "$NPM_TAG"
            else
              npm publish --provenance --access public --tag "$NPM_TAG"
            fi
          done
      - name: Summarize Trusted Publisher setup
        if: ${{ !inputs.dryRun && steps.plan.outputs.bootstrap != '[]' }}
        env:
          PACKAGES: ${{ steps.plan.outputs.bootstrap }}
        run: |
          set -euo pipefail
          {
            echo "### Complete npm Trusted Publisher setup"
            echo
            echo "npm trust requires npm 11.15.0 or later. Upgrade with npm install --global npm@^11.15.0 if needed."
            echo "From an interactive maintainer session with two-factor authentication, run:"
            echo
            # shellcheck disable=SC2016
            node --input-type=module -e '
              for (const name of JSON.parse(process.env.PACKAGES)) {
                console.log(`    npm trust github ${name} --repository ${process.env.GITHUB_REPOSITORY} --file deployment.yml --allow-publish --yes`)
              }
            '
            echo
            echo "Remove NPM_TOKEN after a subsequent OIDC publication succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify published package versions
        if: ${{ !inputs.dryRun }}
        env:
          PACKAGE_VERSION: ${{ steps.plan.outputs.version }}
          PACKAGES: ${{ steps.plan.outputs.all }}
        run: |
          set -euo pipefail
          PACKAGE_LINES="$(node --input-type=module -e 'for (const name of JSON.parse(process.env.PACKAGES)) console.log(name)')"
          mapfile -t PACKAGE_NAMES <<< "$PACKAGE_LINES"
          for PACKAGE_NAME in "${PACKAGE_NAMES[@]}"; do
            for ATTEMPT in {1..6}; do
              if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null; then
                echo "Verified $PACKAGE_NAME@$PACKAGE_VERSION."
                break
              fi
              if [ "$ATTEMPT" -eq 6 ]; then
                echo "Unable to verify $PACKAGE_NAME@$PACKAGE_VERSION on npm."
                exit 1
              fi
              sleep 10
            done
          done
