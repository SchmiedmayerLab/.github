name: Test npm Package and Upload Coverage

on:
  workflow_call:
    inputs:
      nodeVersionFile:
        description: |
          Repository-relative Node.js version file.
        required: false
        type: string
        default: '.nvmrc'
      npmVersion:
        description: |
          Optional exact stable npm version override.
          Defaults to the exact packageManager version in package.json.
        required: false
        type: string
        default: ''
      working-directory:
        description: |
          The working directory where the project is located. Defaults to $GITHUB_WORKSPACE.
        required: false
        type: string
        default: '.'
      coverage-files:
        description: |
          Optional comma-separated coverage report paths passed to Codecov.
          Disables automatic report discovery when supplied.
        required: false
        type: string
        default: ''
      setup-firebase-emulator:
        description: |
          Set up the Firebase Emulator.
        required: false
        type: boolean
        default: false
    secrets:
      token:
        description: |
          The Codecov token used for private repositories.
        required: false
      GOOGLE_APPLICATION_CREDENTIALS_BASE64:
        description: |
          The Base64-encoded private key JSON file used to start the Firebase Emulator.
          Only needed if Cloud Functions must run in the emulator.
        required: false

permissions:
  contents: read

jobs:
  testandcoverage:
    name: Test npm Package and Upload Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ inputs.nodeVersionFile }}
          cache: 'npm'
          cache-dependency-path: '${{ inputs.working-directory }}/package-lock.json'
      - name: Use the repository npm version
        env:
          NPM_VERSION_OVERRIDE: ${{ inputs.npmVersion }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          NPM_VERSION="$NPM_VERSION_OVERRIDE"
          if [ -z "$NPM_VERSION" ]; then
            NPM_VERSION="$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { resolve } from "node:path";
              const { packageManager } = JSON.parse(
                readFileSync(resolve(process.env.WORKING_DIRECTORY, "package.json"), "utf8"),
              );
              const match = /^npm@((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$/.exec(packageManager ?? "");
              if (!match) throw new Error("package.json must declare an exact npm packageManager version.");
              console.log(match[1]);
            ')"
          fi

          if [[ ! "$NPM_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "npmVersion must be an exact stable semantic version without leading zeroes."
            exit 1
          fi

          npm install --global --ignore-scripts "npm@$NPM_VERSION"
          INSTALLED_NPM_VERSION="$(npm --version)"
          if [ "$INSTALLED_NPM_VERSION" != "$NPM_VERSION" ]; then
            echo "Expected npm $NPM_VERSION, but installed $INSTALLED_NPM_VERSION."
            exit 1
          fi
      - name: Install Node.js dependencies
        run: npm ci
      - name: Cache Firebase emulators
        if: ${{ runner.environment == 'github-hosted' && inputs.setup-firebase-emulator }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
      - name: Set up Java
        if: ${{ runner.environment == 'github-hosted' && inputs.setup-firebase-emulator }}
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '21'
      - name: Verify Firebase CLI tools
        if: ${{ runner.environment == 'github-hosted' && inputs.setup-firebase-emulator }}
        run: |
          FIREBASE_BINARY="node_modules/.bin/firebase"
          if [ ! -x "$FIREBASE_BINARY" ]; then
            echo "firebase-tools must be installed in the caller's lockfile."
            exit 1
          fi
      - name: Run the tests
        if: ${{ !inputs.setup-firebase-emulator }}
        run: npm test
      - name: Run the tests with Firebase Emulator support
        if: ${{ inputs.setup-firebase-emulator }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_BASE64 }}
        run: |
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS_BASE64" ]; then
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_BASE64" | base64 --decode > "$RUNNER_TEMP/google-application-credentials.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/google-application-credentials.json"
          fi

          npm test
      - name: Clean up Google application credentials
        if: ${{ always() && inputs.setup-firebase-emulator }}
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/google-application-credentials.json"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ always() }}
        with:
          token: ${{ secrets.token }}
          working-directory: ${{ inputs.working-directory }}
          files: ${{ inputs.coverage-files }}
          disable_search: ${{ inputs.coverage-files != '' }}
          fail_ci_if_error: true
